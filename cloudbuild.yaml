# 운영(hooxi-cms-503308) 빌드 전용 — 이미지 빌드 후 gcr.io push까지만.
# 배포(Cloud Run)는 여기서 하지 않는다: Cloud Build 기본 SA엔 run 배포 권한이 없고
# (프로젝트 소유자 IAM 부여 불가), 배포는 사용자 계정(editor)으로 로컬 실행한다 → deploy-prod.sh.
# 사용:  gcloud builds submit --project=hooxi-cms-503308 --config=cloudbuild.yaml .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build',
      '-t', 'gcr.io/$PROJECT_ID/hooxi-cms:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/hooxi-cms:latest',
      '.']
images:
  - 'gcr.io/$PROJECT_ID/hooxi-cms:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/hooxi-cms:latest'
options:
  # 기본 SA 로깅 요구사항 회피(로그는 Cloud Logging으로)
  logging: CLOUD_LOGGING_ONLY
